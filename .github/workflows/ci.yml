# CI do douglasabnovato.dev: testes de integridade dos dados e build de produção
# (tsc -b + vite build) em todo push e pull request. O lint também bloqueia.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes de integridade dos dados
        run: npm test

      - name: Build de produção
        run: npm run build
